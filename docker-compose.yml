# docker-compose.yml
#
# Orchestrates the two services: `app` (this project's FastAPI backend)
# and `ollama` (the local LLM server). Connected by Compose's own private
# network, where each service is reachable by its service name.

services:
  ollama:
    image: ollama/ollama:latest
    environment:
      # Binds the server to all interfaces inside its container, not just
      # 127.0.0.1 — required for the `app` container to reach it at all.
      OLLAMA_HOST: "0.0.0.0"
      # Forces CPU-only inference: this project's dev machine has a GPU
      # incompatible with Ollama's bundled CUDA toolchain (see Phase 2),
      # and whoever evaluates this likely has no GPU set up for Docker
      # either. Running CPU-only avoids depending on GPU passthrough
      # configuration that most machines won't have.
      CUDA_VISIBLE_DEVICES: "-1"
      OLLAMA_MODEL: "${OLLAMA_MODEL}"
    volumes:
      # Named volume: the downloaded model survives container restarts
      # and recreations. Without this, every `docker compose down` would
      # throw away a multi-GB download.
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & sleep 5 && ollama pull $$OLLAMA_MODEL && wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Overrides the value from .env: locally that file points to
      # localhost (for running outside Docker), but inside this network
      # Ollama is only reachable by its service name.
      OLLAMA_HOST: "http://ollama:11434"
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ollama_data: